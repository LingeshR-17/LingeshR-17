  <!-- ================= AUTHENTIC OPTICAL & PHOSPHOR SCANNER (TOP LAYER) ================= -->
  <g class="fluid-scanner-sweep" pointer-events="none">
    <!-- 1. Deep Phosphor Comet Wake (trailing upwards like an electron beam) -->
    <rect x="0" y="0" width="960" height="90" fill="url(#lokiPhosphorTrail)"/>

    <!-- 2. Fine CRT Horizontal Scanline Texture in the beam -->
    <rect x="0" y="10" width="960" height="80" fill="url(#laserScanGrid)"/>

    <!-- 3. Razor Cutting-Edge Laser Line (the active focal sweep) -->
    <line x1="0" y1="90" x2="960" y2="90" stroke="#4ade80" stroke-width="2" class="laser-flicker" style="filter: drop-shadow(0 0 8px #22c55e);"/>
    <line x1="0" y1="90" x2="960" y2="90" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>

    <!-- 4. High-Speed Horizontal Sync Glitch Elements (pure horizontal jitter, no vertical freeze) -->
