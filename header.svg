      <text x="390" y="34" text-anchor="end" class="font-hud" font-size="16" font-weight="900" fill="#fbbf24">600+</text>
    </g>

    <!-- Communication Relay -->
    <g transform="translate(470, 46)">
      <polygon points="8,0 390,0 394,12 394,58 0,58 0,8" fill="#0d1424" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
      <text x="18" y="22" class="font-mono" font-size="10" fill="#64748b">> RELAY: DIRECT DISPATCH</text>
      <text x="18" y="42" class="font-mono" font-size="11" font-weight="700" fill="#cbd5e1">✉ lingeshprt2008@gmail.com</text>
      <text x="270" y="42" class="font-mono" font-size="11" font-weight="700" fill="#00f2fe">in/lingesh17</text>
    </g>

    <!-- Bottom Conduit Tracer -->
    <line x1="24" y1="124" x2="864" y2="124" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5"/>
    <line x1="24" y1="124" x2="864" y2="124" stroke="url(#arcReactorGrad)" stroke-width="2" class="conduit-stream" stroke-linecap="round"/>

    <text x="24" y="142" class="font-mono" font-size="9" fill="#475569">AUTH // LINGESH R • CIT CHENNAI • FULL STACK &amp; DSA DISCIPLINE</text>
    <text x="864" y="142" class="font-mono" font-size="9" fill="#475569" text-anchor="end">STATUS: READY FOR MISSION DISPATCH</text>
