<svg fill="none" viewBox="0 0 960 520" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Deep Cosmic Obsidian Canvas Gradients -->
    <radialGradient id="spaceVoid" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#070913" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020307" stop-opacity="1"/>
    </radialGradient>

    <!-- Arc Reactor Cyan Core Energy -->
    <linearGradient id="arcReactorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Authentic Directional Phosphor Trailing Beam (Downward sweep decay) -->
    <linearGradient id="lokiPhosphorTrail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="75%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="96%" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.8"/>
    </linearGradient>

    <!-- High-Definition Horizontal Phosphor Scanlines -->
    <pattern id="laserScanGrid" width="100%" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="960" y2="0" stroke="#047857" stroke-width="0.8" opacity="0.35"/>
    </pattern>

    <!-- Structural Hairline Grid -->
    <pattern id="tacticalGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="rgba(56, 189, 248, 0.08)"/>
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.015)" stroke-width="0.8"/>
    </pattern>

    <!-- Circular Avatar Clip (Centered Portrait Core) -->
    <clipPath id="arcCoreAvatarClip">
      <circle cx="480" cy="180" r="56"/>
    </clipPath>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&amp;family=Share+Tech+Mono&amp;display=swap');

      .font-hud { font-family: 'Orbitron', sans-serif; }
      .font-mono { font-family: 'Share Tech Mono', monospace; }

      /* Multi-Stage Arc Reactor Spinning Coils */
      .arc-ring-coils {
        transform-origin: 480px 180px;
        animation: spinReactorCW 16s linear infinite;
      }
      .arc-ring-segments {
        transform-origin: 480px 180px;
        animation: spinReactorCCW 10s linear infinite;
      }
      .arc-ring-outer {
        transform-origin: 480px 180px;
        animation: spinReactorCW 28s linear infinite;
      }

      @keyframes spinReactorCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinReactorCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

      /* Arc Core Energy Breathing Pulse */
      .arc-pulse-glow {
        animation: arcGlow 2.4s ease-in-out infinite alternate;
      }
      @keyframes arcGlow {
        0% { filter: drop-shadow(0 0 3px rgba(0, 242, 254, 0.4)); opacity: 0.8; }
        100% { filter: drop-shadow(0 0 16px rgba(0, 242, 254, 0.95)); opacity: 1; }
      }

      /* Conduit Tracer Flow */
      .conduit-stream {
        stroke-dasharray: 90 320;
        animation: beamTransit 4.5s linear infinite;
      }
      @keyframes beamTransit {
        0% { stroke-dashoffset: 410; }
        100% { stroke-dashoffset: 0; }
      }

      /* 1. CONTINUOUS UNBROKEN VERTICAL SWEEP (Never stalls or freezes) */
      .fluid-scanner-sweep {
        animation: smoothVerticalScan 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        mix-blend-mode: screen;
      }
      @keyframes smoothVerticalScan {
        0% {
          transform: translateY(-80px);
        }
        100% {
          transform: translateY(480px);
        }
      }

      /* 2. HIGH-FREQUENCY HORIZONTAL CRT JITTER (Glitch happens sideways without pausing vertical motion) */
      .glitch-displacement-strip {
        animation: hSyncJitter 0.24s steps(3, start) infinite;
      }
      @keyframes hSyncJitter {
        0% { transform: translateX(0px); opacity: 0.9; }
        25% { transform: translateX(-8px) scaleX(1.02); opacity: 1; }
        50% { transform: translateX(12px) scaleX(0.98); opacity: 0.8; }
        75% { transform: translateX(-4px); opacity: 1; }
        100% { transform: translateX(0px); opacity: 0.9; }
      }

      /* Secondary Micro-Flicker in the laser ribbon */
      .laser-flicker {
        animation: phosphorFluctuation 1.8s ease-in-out infinite alternate;
      }
      @keyframes phosphorFluctuation {
        0% { opacity: 0.82; }
        50% { opacity: 1; filter: drop-shadow(0 0 12px #22c55e); }
        100% { opacity: 0.88; }
      }
    </style>
  </defs>

  <!-- Base Space Void Canvas -->
  <rect width="960" height="520" rx="14" fill="#020307"/>
  <rect width="960" height="520" rx="14" fill="url(#spaceVoid)"/>
  <rect width="960" height="520" rx="14" fill="url(#tacticalGrid)"/>

  <!-- Outer Tactical Border Frame -->
  <polygon points="26,0 934,0 960,26 960,494 934,520 26,520 0,494 0,26" 
           fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.4"/>

  <!-- Precision Corner Brackets -->
  <path d="M 0 36 L 0 26 L 26 0 L 36 0" stroke="#00f2fe" stroke-width="2.5" fill="none"/>
  <path d="M 960 36 L 960 26 L 934 0 L 924 0" stroke="#00f2fe" stroke-width="2.5" fill="none"/>
  <path d="M 960 484 L 960 494 L 934 520 L 924 520" stroke="#00f2fe" stroke-width="2.5" fill="none"/>
  <path d="M 0 484 L 0 494 L 26 520 L 36 520" stroke="#00f2fe" stroke-width="2.5" fill="none"/>

  <!-- ================= TOP CLASSIFIED TELEMETRY RIBBON ================= -->
  <g transform="translate(36, 28)">
    <polygon points="8,0 420,0 432,24 0,24" fill="#0b1120" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <circle cx="14" cy="12" r="3.5" fill="#00f2fe" class="arc-pulse-glow"/>
    <text x="26" y="16" class="font-hud" font-size="9" fill="#00f2fe" font-weight="800">QUANTUM TEMPORAL SCAN // ACTIVE</text>
    <text x="268" y="16" class="font-mono" font-size="9.5" fill="#64748b">STATUS: COMPILED RUNTIME</text>

    <!-- Coordinates Ribbon (Panruti, TN) -->
    <g transform="translate(460, 0)">
      <polygon points="0,0 416,0 428,24 12,24" fill="#0b1120" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="32" y="16" class="font-mono" font-size="9" fill="#94a3b8">LOC // PANRUTI, TN, INDIA • LAT 11.77° N, LNG 79.55° E</text>
      <circle cx="410" cy="12" r="3" fill="#10b981"/>
    </g>
  </g>

  <!-- ================= CENTRAL SPINNING ARC REACTOR CORE ================= -->
  <g id="arcReactorSystem" class="arc-pulse-glow">
    <circle cx="480" cy="180" r="88" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1"/>
    <circle cx="480" cy="180" r="82" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 14" class="arc-ring-outer" opacity="0.8"/>
    
    <!-- 10 Magnetic Energy Coils -->
    <g class="arc-ring-coils">
      <circle cx="480" cy="180" r="72" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1"/>
      <rect x="475" y="104" width="10" height="8" rx="1.5" fill="#00f2fe"/>
      <rect x="475" y="248" width="10" height="8" rx="1.5" fill="#00f2fe"/>
      <rect x="404" y="175" width="8" height="10" rx="1.5" fill="#00f2fe"/>
      <rect x="548" y="175" width="8" height="10" rx="1.5" fill="#00f2fe"/>
      
      <!-- Angled Coils -->
      <rect x="475" y="104" width="10" height="8" rx="1.5" fill="#38bdf8" transform="rotate(36 480 180)"/>
      <rect x="475" y="104" width="10" height="8" rx="1.5" fill="#38bdf8" transform="rotate(72 480 180)"/>
      <rect x="475" y="104" width="10" height="8" rx="1.5" fill="#38bdf8" transform="rotate(108 480 180)"/>
      <rect x="475" y="104" width="10" height="8" rx="1.5" fill="#38bdf8" transform="rotate(144 480 180)"/>
      <rect x="475" y="104" width="10" height="8" rx="1.5" fill="#38bdf8" transform="rotate(216 480 180)"/>
      <rect x="475" y="104" width="10" height="8" rx="1.5" fill="#38bdf8" transform="rotate(252 480 180)"/>
      <rect x="475" y="104" width="10" height="8" rx="1.5" fill="#38bdf8" transform="rotate(288 480 180)"/>
      <rect x="475" y="104" width="10" height="8" rx="1.5" fill="#38bdf8" transform="rotate(324 480 180)"/>
    </g>

    <!-- Inner High-Velocity Plasma Ring -->
    <circle cx="480" cy="180" r="62" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="24 16" class="arc-ring-segments"/>
    <circle cx="480" cy="180" r="57" stroke="#00f2fe" stroke-width="1.2" opacity="0.7"/>

    <!-- Cropped Avatar Image Center Frame -->
    <circle cx="480" cy="180" r="56" fill="#080c14"/>
    <image id="userPortrait" 
           x="375" y="100" width="210" height="280" 
           clip-path="url(#arcCoreAvatarClip)"
           preserveAspectRatio="xMidYMin slice"
          xlink:href="https://raw.githubusercontent.com/LingeshR-17/LingeshR-17/main/avatar.jpg"/>

    <!-- Monogram Plaque Anchor -->
    <polygon points="400,248 560,248 574,272 386,272" fill="#070c17" stroke="#00f2fe" stroke-width="1.2"/>
    <text x="480" y="265" text-anchor="middle" class="font-hud" font-size="14" font-weight="900" fill="#f8fafc" letter-spacing="3">LINGESH R</text>
    <text x="480" y="284" text-anchor="middle" class="font-mono" font-size="9" fill="#00f2fe">@Lingeshprt17 • CIT CHENNAI</text>
  </g>

  <!-- ================= LEFT COMMAND WING ================= -->
  <g transform="translate(36, 76)">
    <polygon points="18,0 330,0 310,210 0,210 0,18" 
