    <line x1="0" y1="18" x2="18" y2="0" stroke="#00f2fe" stroke-width="2"/>

    <g transform="translate(18, 16)">
      <polygon points="4,0 268,0 274,22 0,22" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1"/>
      <text x="12" y="15" class="font-hud" font-size="9.5" font-weight="900" fill="#00f2fe" letter-spacing="1">PRIMARY CLASSIFICATION</text>
      
      <text x="0" y="50" class="font-hud" font-size="17" font-weight="900" fill="#ffffff">JAVA FULL STACK</text>
      <text x="0" y="70" class="font-hud" font-size="15" font-weight="900" fill="#00f2fe">DEVELOPER</text>

      <g transform="translate(0, 94)">
        <text x="0" y="0" class="font-mono" font-size="11" fill="#cbd5e1">> Full Stack Developer</text>
        <text x="0" y="20" class="font-mono" font-size="11" fill="#cbd5e1">> Core Algorithmic Coder</text>
        <text x="0" y="40" class="font-mono" font-size="11" fill="#cbd5e1">> Emerging Tech Enthusiast</text>

        <g transform="translate(0, 52)">
          <polygon points="4,0 220,0 226,20 0,20" fill="#111c30" stroke="#818cf8" stroke-width="0.8"/>
          <text x="10" y="14" class="font-mono" font-size="10" font-weight="700" fill="#818cf8">⚡ Developer at Hackerz</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COMMAND WING ================= -->
  <g transform="translate(594, 76)">
    <polygon points="0,0 312,0 330,18 330,210 20,210" 
             fill="#080d18" stroke="rgba(56, 189, 248, 0.16)" stroke-width="1.2"/>
    <line x1="312" y1="0" x2="330" y2="18" stroke="#00f2fe" stroke-width="2"/>

    <g transform="translate(24, 16)">
      <polygon points="4,0 268,0 274,22 0,22" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1"/>
      <text x="12" y="15" class="font-hud" font-size="9.5" font-weight="900" fill="#00f2fe" letter-spacing="1">QUANTUM ARSENAL</text>

      <!-- Row 1 -->
      <g transform="translate(0, 38)">
        <polygon points="6,0 60,0 66,20 0,20" fill="#0f1a2e" stroke="#00f2fe" stroke-width="1"/>
        <text x="33" y="14" text-anchor="middle" class="font-hud" font-size="9" font-weight="800" fill="#f8fafc">JAVA</text>

        <polygon points="76,0 170,0 176,20 70,20" fill="#0f1a2e" stroke="#00f2fe" stroke-width="1"/>
        <text x="123" y="14" text-anchor="middle" class="font-hud" font-size="9" font-weight="800" fill="#00f2fe">SPRINGBOOT</text>

        <polygon points="186,0 248,0 254,20 180,20" fill="#0f1a2e" stroke="#818cf8" stroke-width="1"/>
        <text x="217" y="14" text-anchor="middle" class="font-hud" font-size="9" font-weight="800" fill="#818cf8">REACT</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 68)">
        <polygon points="6,0 72,0 78,20 0,20" fill="#0f1a2e" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="39" y="14" text-anchor="middle" class="font-mono" font-size="10" fill="#cbd5e1">Python</text>

        <polygon points="86,0 144,0 150,20 80,20" fill="#0f1a2e" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="115" y="14" text-anchor="middle" class="font-mono" font-size="10" fill="#cbd5e1">C / C++</text>

        <polygon points="158,0 264,0 270,20 152,20" fill="#0f1a2e" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="211" y="14" text-anchor="middle" class="font-mono" font-size="10" fill="#cbd5e1">React Native</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 98)">
        <polygon points="6,0 86,0 92,20 0,20" fill="#0f1a2e" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="46" y="14" text-anchor="middle" class="font-mono" font-size="10" fill="#cbd5e1">JavaScript</text>

        <polygon points="98,0 178,0 184,20 92,20" fill="#0f1a2e" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="138" y="14" text-anchor="middle" class="font-mono" font-size="10" fill="#cbd5e1">HTML/CSS</text>

        <polygon points="190,0 252,0 258,20 184,20" fill="#0f1a2e" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="221" y="14" text-anchor="middle" class="font-mono" font-size="10" fill="#cbd5e1">MySQL</text>
      </g>

      <g transform="translate(0, 134)">
        <text x="0" y="0" class="font-mono" font-size="9" fill="#64748b">DEVELOPMENT ECOSYSTEM</text>
        <text x="0" y="16" class="font-mono" font-size="10" fill="#94a3b8">Git • GitHub • VS Code • Postman • Firebase • Expo</text>
      </g>
    </g>
  </g>

  <!-- ================= LOWER HULL ================= -->
  <g transform="translate(36, 312)">
    <polygon points="14,0 874,0 888,14 888,138 874,152 14,152 0,138 0,14" 
             fill="#070b14" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.2"/>

    <path d="M 0 0 L 874 0 L 888 14 L 888 28 L 0 28 Z" fill="#050810"/>
    <line x1="0" y1="28" x2="888" y2="28" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    
    <text x="18" y="18" class="font-hud" font-size="9.5" font-weight="800" fill="#00f2fe">CORE DIRECTIVE: PROBLEM SOLVING &amp; ALGORITHMIC STRENGTH</text>
    <text x="870" y="18" text-anchor="end" class="font-mono" font-size="9.5" fill="#10b981">● PROTOCOL VERIFIED</text>

    <!-- LeetCode Benchmark -->
    <g transform="translate(24, 46)">
      <polygon points="8,0 410,0 422,12 422,58 0,58 0,8" fill="#0d1424" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1"/>
      <circle cx="20" cy="20" r="4" fill="#fbbf24"/>
      <text x="32" y="24" class="font-hud" font-size="12" font-weight="900" fill="#f8fafc">LEETCODE: 600+ PROBLEMS SOLVED</text>
