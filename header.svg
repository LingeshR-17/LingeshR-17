      <rect x="60" y="86" width="160" height="5" fill="#86efac" opacity="0.9" style="filter: drop-shadow(0 0 6px #22c55e);"/>
      <rect x="340" y="88" width="240" height="3" fill="#ffffff" opacity="0.95"/>
      <rect x="710" y="85" width="180" height="6" fill="#86efac" opacity="0.85" style="filter: drop-shadow(0 0 6px #22c55e);"/>
